<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="description" content="{% block desc %}SmartBite delivers food from approved local restaurants to your door. Order, pay and track your rider in real time.{% endblock %}">
<title>{% block title %}SmartBite - Food delivery{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block head %}{% endblock %}
</head>
<body data-auth="{{ 1 if current_user.is_authenticated else 0 }}" data-notif-url="{{ url_for('api_unread') if current_user.is_authenticated else '' }}">
{% include 'partials/nav_public.html' %}
{% block content %}{% endblock %}
{% block footer %}{% include 'partials/footer.html' %}{% endblock %}
<div id="toasts" aria-live="polite"></div>
{% with msgs = get_flashed_messages(with_categories=true) %}<script type="application/json" id="flash-data">{{ msgs|tojson }}</script>{% endwith %}
{% block scripts %}{% endblock %}
</body>
</html>
