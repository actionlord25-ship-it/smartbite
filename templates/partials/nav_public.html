<header class="site-nav">
  <div class="container nav-inner">
    <a class="brand" href="{{ url_for('index') }}" aria-label="SmartBite home">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="" width="38" height="38"><span><span class="smart">Smart</span><span class="bite">Bite</span></span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="{{ url_for('index') }}#home">Home</a>
      <a href="{{ url_for('index') }}#services">Services</a>
      <a href="{{ url_for('index') }}#how">How It Works</a>
      <a href="{{ url_for('index') }}#testimonies">Testimonies</a>
      <a href="{{ url_for('index') }}#about">About Us</a>
      <a href="{{ url_for('index') }}#contact">Contact Us</a>
    </nav>
    <div class="nav-cta">
      {% if current_user.is_authenticated %}
        <a class="btn btn-primary btn-sm" href="{{ home_url }}">Open dashboard</a>
      {% else %}
        <a class="btn btn-ghost btn-sm" href="{{ url_for('login') }}">Login</a>
        <a class="btn btn-primary btn-sm" href="{{ url_for('signup') }}">Sign Up</a>
      {% endif %}
      <button type="button" class="icon-btn nav-toggle" data-nav-toggle aria-label="Open menu">{{ icon('menu') }}</button>
    </div>
  </div>
</header>
